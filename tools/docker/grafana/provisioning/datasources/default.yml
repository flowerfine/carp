apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    org_id: 1
    url: 'http://host.docker.internal:9090'
    is_default: true
    version: 1
    editable: true
  - name: Loki
    type: loki
    access: proxy
    url: 'http://host.docker.internal:3100'
    jsonData:
      maxLines: 1000