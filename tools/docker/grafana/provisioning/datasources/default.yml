apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    org_id: 1
    url: 'http://host.docker.internal:9090'
    is_default: true
    version: 1
    editable: false
  - name: VictoriaMetrics
    type: victoriametrics-metrics-datasource
    access: proxy
    url: 'http://host.docker.internal:8428'
    version: 1
    editable: false